name: ci

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No install step: the audit and its tests have no dependencies, by the decision recorded in
      # design/standards-audit-cli.md. If an `npm ci` ever appears here, that decision changed.

      # Proves the standards series has not silently changed shape. The inventory is reviewed and
      # committed; this compares source extraction against it rather than re-deriving the count.
      - name: Source inventory
        run: npm run inventory

      # Holds each standard to its own word: any block claiming to be verbatim source must be.
      - name: Source fidelity
        run: npm run fidelity

      # Validates this repository's own project-policy.yml against schemas/project-policy.schema.json.
      # Exit 2 (malformed policy) and exit 1 (a compliance condition such as an expired exception)
      # are both failures here, and both are meant to be: a policy nothing can read is worse than
      # one that reports a problem.
      - name: Project policy
        run: npm run policy

      - name: Test
        run: npm test

      # The standards repository is audited by its own audit. This is not ceremony: it is the only
      # thing that would catch the published standards and the tool that checks them drifting apart.
      #
      # Deliberately not --strict. That flag fails on warnings too, which would turn every advisory
      # finding — a heuristic dead-code guess, a missing document — into a broken build, and the
      # predictable result is that someone disables the step. The gate on *errors* is the assertion
      # in test/audit.test.mjs that this repository has no error-severity findings, which runs above.
      - name: Audit this repository
        run: npm run audit
