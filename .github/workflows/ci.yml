name: ci

on:
  push:
    branches: [develop, master]
  pull_request:
  # Runnable on demand, on any ref. This gate went unexercised from the repository's first day to
  # 2026-08-11 — the account could not start a runner, so thirty consecutive red runs said nothing
  # about the code — and when it finally ran it failed before the first test. A required check that
  # can only be observed by merging toward the branch it protects is a check nobody can test.
  workflow_dispatch:

# The step list below is not the definition of what CI covers. `scripts/pipeline.mjs` is, and the
# same list is executed by `scripts/ci.ps1` / `scripts/ci.sh` inside a container before a branch is
# ever pushed (docs/local-ci.md). The steps here stay spelled out one per line because each carries a
# reason worth reading and because GitHub's UI reports them individually — but they run the same
# `npm run …` commands, and `test/local-ci.test.mjs` fails if the two ever name different sets, in
# either direction. Adding a check here without adding a stage there is a caught error, not a drift.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No install step: the audit and its tests have no dependencies, by the decision recorded in
      # design/standards-audit-cli.md. If an `npm ci` ever appears here, that decision changed.

      # Proves the standards series has not silently changed shape. The inventory is reviewed and
      # committed; this compares source extraction against it rather than re-deriving the count.
      - name: Source inventory
        run: npm run inventory

      # Holds each standard to its own word: any block claiming to be verbatim source must be.
      - name: Source fidelity
        run: npm run fidelity

      # Validates this repository's own project-policy.yml against schemas/project-policy.schema.json.
      # Exit 2 (malformed policy) and exit 1 (a compliance condition such as an expired exception)
      # are both failures here, and both are meant to be: a policy nothing can read is worse than
      # one that reports a problem.
      - name: Project policy
        run: npm run policy

      # Standard 39 R4: detect when Mermaid source and its derived copies fall out of sync. This
      # compares text rather than rendering anything, which is what lets a zero-dependency
      # repository enforce the rule at all — a check needing a headless browser would not run here,
      # and the rule would go unenforced.
      - name: Diagram freshness
        run: npm run diagrams

      - name: Test
        run: npm test

      # The standards repository is audited by its own audit, and since the compliance engine landed
      # this step also produces a Standard 30 verdict from rules/ and project-policy.yml. A
      # required-level failure exits 1 and breaks the build; an unreadable policy exits 2. This is not
      # ceremony: it is the only thing that would catch the published standards and the tool that
      # checks them drifting apart.
      #
      # Deliberately not --strict. That flag fails on warnings too, which would turn every advisory
      # finding — a heuristic dead-code guess, a missing document — into a broken build, and the
      # predictable result is that someone disables the step. The gate on *errors* is the assertion
      # in test/audit.test.mjs that this repository has no error-severity findings, which runs above.
      - name: Audit this repository
        run: npm run audit

  # A SEPARATE JOB, and the separation is a governance decision rather than a layout preference.
  #
  # `validate` is the authoritative verdict (ADR 0004) and this repository is intentionally
  # NON_COMPLIANT: four rules carry recorded human rejections, so the honest result is exit 1. While
  # this step lived inside `test`, the required check could never pass, and combined with PR-only
  # protection that left no legal path to change `develop` — every pull request needed a check
  # designed to fail, and its failure was the correct answer.
  #
  # What changed is which unit branch protection names, NOT what the validator reports. This job runs
  # on every push, pull request and dispatch, applies the same policy, and propagates the same exit
  # status; a failure here still turns the whole workflow red. `test` is required and can pass;
  # `validate` is visible and not required, and becomes required only when this repository can
  # satisfy it honestly. A baseline exception declaring today's four failures acceptable would make
  # that day arrive sooner by encoding non-compliance as a passing condition, and is refused.
  #
  # No `needs: test`. The two answer different questions and one pull request should be able to
  # expose both classes of defect in a single run; making compliance evaluation conditional on green
  # tests would suppress the verdict exactly when something is already wrong.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `validate` applies this repository's own policy and exits 1 on a required-rule failure
      # regardless of --strict, and 2 if the policy cannot be read. This is the command consuming
      # projects are told to gate on (ADR 0004), so it is the one this repository runs.
      - name: Validate this repository
        run: npm run validate
