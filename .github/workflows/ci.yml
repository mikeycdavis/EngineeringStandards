name: ci

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No install step: the audit and its tests have no dependencies, by the decision recorded in
      # design/standards-audit-cli.md. If an `npm ci` ever appears here, that decision changed.

      # Proves the standards series has not silently changed shape. The inventory is reviewed and
      # committed; this compares source extraction against it rather than re-deriving the count.
      - name: Source inventory
        run: npm run inventory

      # Holds each standard to its own word: any block claiming to be verbatim source must be.
      - name: Source fidelity
        run: npm run fidelity

      # Validates this repository's own project-policy.yml against schemas/project-policy.schema.json.
      # Exit 2 (malformed policy) and exit 1 (a compliance condition such as an expired exception)
      # are both failures here, and both are meant to be: a policy nothing can read is worse than
      # one that reports a problem.
      - name: Project policy
        run: npm run policy

      # Standard 39 R4: detect when Mermaid source and its derived copies fall out of sync. This
      # compares text rather than rendering anything, which is what lets a zero-dependency
      # repository enforce the rule at all — a check needing a headless browser would not run here,
      # and the rule would go unenforced.
      - name: Diagram freshness
        run: npm run diagrams

      - name: Test
        run: npm test

      # The standards repository is audited by its own audit, and since the compliance engine landed
      # this step also produces a Standard 30 verdict from rules/ and project-policy.yml. A
      # required-level failure exits 1 and breaks the build; an unreadable policy exits 2. This is not
      # ceremony: it is the only thing that would catch the published standards and the tool that
      # checks them drifting apart.
      #
      # Deliberately not --strict. That flag fails on warnings too, which would turn every advisory
      # finding — a heuristic dead-code guess, a missing document — into a broken build, and the
      # predictable result is that someone disables the step. The gate on *errors* is the assertion
      # in test/audit.test.mjs that this repository has no error-severity findings, which runs above.
      - name: Audit this repository
        run: npm run audit

      # The gate. `validate` applies this repository's own policy and exits 1 on a required-rule
      # failure regardless of --strict, and 2 if the policy cannot be read. This is the command
      # consuming projects are told to gate on (ADR 0004), so it is the one this repository gates on.
      - name: Validate this repository
        run: npm run validate
