# Project policy for the EngineeringStandards repository itself.
#
# This is the first dogfooded instance (Standard 34 R1) and therefore the pattern every adopting
# project will copy — including its mistakes. Three rules govern what may appear here:
#
#   * Rule IDs are canonical only (ADR 0002). No camelCase aliases; the schema rejects them.
#   * `applicability` and `exceptions` are different mechanisms and never substitute for each other.
#     not-applicable = the rule has no subject in this project.
#     exception      = the rule applies and this project knowingly does not satisfy it.
#   * Nothing here asserts compliance. What this project actually meets is a validation result.
#
# Shape: schemas/project-policy.schema.json (Standard 19). Meaning: standards/18-machine-readable-project-policy.md.

standardVersion: "2.0.0"
project: "EngineeringStandards"

rules:
  planning.breakdown-directory:
    level: required
  planning.one-file-per-section:
    level: required
  planning.acceptance-criteria:
    level: required
  planning.verification:
    level: required
  planning.handoff:
    level: required

  audit.business-state:
    level: required
  audit.actor-attribution:
    level: required

  ai.non-ui-capabilities:
    level: required
  ai.provider-neutral:
    level: required
  ai.propose-execute:
    level: required
  ai.destructive-approval:
    level: required

  architecture.project-manifest:
    level: required
  architecture.adr:
    level: required

  security.no-secrets-in-artifacts:
    level: required

  verification.before-completion:
    level: required

  # The must-never layer (Standards 45-53), adopted at 2.0.0 at its catalog level.
  #
  # `forbidden` differs from `required` in what satisfying it looks like: there is no positive
  # artifact to point at, only the absence of a violation. A `passed` here means "no violation was
  # found by the stated search" — never "this project does not do that" (Standard 45 R2). And a
  # forbidden rule nobody has examined blocks COMPLIANT rather than passing quietly
  # (Standard 45 R6), which is why every one of these is either evaluated, attested, or declared
  # not-applicable below.
  meta.standards-not-weakened:
    level: forbidden

  scm.no-committed-env-files:
    level: forbidden
  scm.no-generated-artifacts:
    level: recommended
  scm.no-shared-history-rewrite:
    level: forbidden

  testing.no-weakening-to-pass:
    level: forbidden
  testing.no-fabricated-results:
    level: forbidden
  testing.no-tautological-tests:
    level: recommended

  errors.no-swallowed-exceptions:
    level: forbidden
  errors.no-false-success:
    level: forbidden
  errors.no-unbounded-retry:
    level: forbidden
  observability.no-silenced-failures:
    level: forbidden

  data.migration-rollback:
    level: forbidden
  data.no-silent-discard:
    level: forbidden
  data.no-audit-corruption:
    level: forbidden
  data.no-prod-data-in-dev:
    level: forbidden

  security.no-disabled-access-controls:
    level: forbidden
  security.no-cert-bypass:
    level: forbidden
  security.no-sql-concat:
    level: forbidden
  security.no-untrusted-exec:
    level: forbidden

  architecture.no-hidden-global-state:
    level: forbidden
  architecture.no-boundary-bypass:
    level: forbidden
  architecture.no-duplicate-implementations:
    level: forbidden
  architecture.dependency-evaluation:
    level: required

  concurrency.no-unmanaged-shared-state:
    level: forbidden

  ai.no-fabricated-capabilities:
    level: forbidden
  ai.no-safety-bypass:
    level: forbidden

# Rules whose subject does not exist in this repository. Each is a claim about THIS PROJECT, not
# about the rule, and stops being true the moment the capability is added — hence `revisitWhen`.
applicability:
  audit.business-state:
    status: not-applicable
    reason: "No application state. This repository is documents, a CLI, and its tests; it performs no business mutations to audit."
    reviewedAt: "2026-08-08"
    revisitWhen: "Any command writes durable state outside the working tree."

  audit.actor-attribution:
    status: not-applicable
    reason: "No mutations exist to attribute. Authorship of repository changes is carried by git, which is not the audit system this rule governs."
    reviewedAt: "2026-08-08"
    revisitWhen: "Any command writes durable state outside the working tree."

  ai.non-ui-capabilities:
    status: not-applicable
    reason: "No user interface exists. Every capability is already a CLI invocation, so the rule's subject — a capability reachable only through a UI — cannot occur here."
    reviewedAt: "2026-08-08"
    revisitWhen: "Any interface other than the CLI is added."

  ai.provider-neutral:
    status: not-applicable
    reason: "No AI provider is integrated. The repository has zero dependencies and calls no model."
    reviewedAt: "2026-08-08"
    revisitWhen: "Any capability calls a model provider."

  # Must-never rules whose subject does not exist here (Standard 45 R6's third resolution path).
  #
  # Each is a claim about THIS PROJECT that was checked against the repository, not a convenient way
  # to clear the verdict — the rules with a real subject here are left unestablished until a human
  # attests to them, which is why this file still reports NOT_EVALUATED rather than COMPLIANT.
  #
  # Note what is NOT declared here: architecture.no-hidden-global-state has a real subject, because
  # scripts/standards.mjs holds module-level mutable state. Declaring it not-applicable because the
  # process is short-lived would be the self-exemption Standard 34 R3 prohibits.

  data.migration-rollback:
    status: not-applicable
    reason: "No database and no migrations. The repository has zero dependencies, no schema, and no data store; the mongodb and postgres strings in scripts/standards.mjs are the detector's own pattern table, which is a mention rather than a use."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any persistent store is added, or any script alters data it did not create."

  data.no-silent-discard:
    status: not-applicable
    reason: "No user data exists to discard. The tooling reads the repository's own files and writes reports; where a report truncates a long evidence list it says so in the message, and that is the closest thing here to the rule's subject."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any capability accepts and stores data on a user's behalf."

  data.no-audit-corruption:
    status: not-applicable
    reason: "No audit or historical store exists. Change history is git's, which this framework does not write."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any command writes an audit record."

  data.no-prod-data-in-dev:
    status: not-applicable
    reason: "No production environment and no production data exist. Every fixture under test/fixtures/ is authored for its test."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any environment holds real data, or any fixture is derived from a real dataset."

  security.no-disabled-access-controls:
    status: not-applicable
    reason: "No authentication or authorization exists to disable. The CLI reads a local directory and writes to stdout; there is no identity, no session, no permission model, and no client-supplied claim anywhere in scripts/."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any capability authenticates a caller or makes an authorization decision."

  security.no-untrusted-exec:
    status: not-applicable
    reason: "Nothing is executed as code. scripts/ contains no eval, no Function constructor, no node:vm, and no child_process; every input is parsed as data by scripts/yaml.mjs or JSON.parse."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any code path evaluates, spawns, or dynamically imports a value derived from input."

  errors.no-unbounded-retry:
    status: not-applicable
    reason: "No retry logic exists. Every script is a single pass over local files with no network calls and no loops that re-attempt a failed operation."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any capability retries, reconnects, or polls."

  concurrency.no-unmanaged-shared-state:
    status: not-applicable
    reason: "No concurrent execution. Each script is a single-threaded pass, and the test runner isolates test files in separate processes, so the module-level state in scripts/standards.mjs is reachable from exactly one execution context. That state is real and is architecture.no-hidden-global-state's subject, not this rule's."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any script uses workers, threads, or in-process parallelism, or CI runs steps that share a mutable resource."

  # The reason establishes only that the rule has no subject here. It deliberately does NOT say
  # "no failures are silenced" — that would be a claim about behaviour nobody reviewed, and it would
  # turn a not-applicable declaration back into the attestation it exists instead of.
  observability.no-silenced-failures:
    status: not-applicable
    reason: "This repository has no telemetry, alerting, monitoring, or failure-notification subsystem whose signals could be suppressed, disabled, or dropped. Current diagnostics are limited to CLI output, process exit codes, test failures, and CI results, which are governed by other standards and are not an observability subsystem for this rule."
    reviewedAt: "2026-08-09"
    revisitWhen: "The repository adds telemetry, structured operational logging, alerting, monitoring, failure notifications, metrics emission, tracing, or another persistent observability channel."

# ai.destructive-approval was declared not-applicable until 2026-08-09, with the trigger
# "`standards init` lands — it writes files, and Standard 33 R2's overwrite permission is exactly
# this rule." It landed, so the declaration was removed and the rule now applies at its catalog
# level. That is the whole purpose of `revisitWhen`: an applicability claim is a statement about the
# project at a moment, and this one stopped being true the moment the project gained the capability.
#
# No exceptions. Every rule that applies here is either met, failing, or honestly unevaluated, and a
# failing rule is reported as a failure rather than waived (Standard 20, Standard 30 R2).
exceptions: []

# Recorded human judgement for rules the catalog says a human evaluates (ADR 0005).
#
# An attestation is EVIDENCE, not a waiver. It never overrides an automated failure, and it goes
# stale the moment the reviewed paths change — which is why `reviewedAgainst` names them.
attestations:
  ai.destructive-approval:
    status: approved
    reviewedBy: "project-owner"
    reviewedAt: "2026-08-09"
    # One line: scripts/yaml.mjs supports a deliberately small subset and rejects block scalars
    # rather than guessing at them. The parser failing loudly here is the design working.
    evidence: "Reviewed the standards init write path. Creating a missing artifact is ordinary execute; replacing an existing one is refused by default and reported as a conflict. Overwriting requires naming the exact path, and approving one path does not approve another. Verified by the safety-contract tests in test/init.test.mjs. Re-reviewed 2026-08-09 after AGENTS.md and CLAUDE.md were added to ARTIFACTS: the additions widen what init creates and leave the create/overwrite/conflict logic untouched, so every path still routes through the same refusal. RE-REVIEWED 2026-08-09 after the reconciliation: section-heading ownership is unchanged and both holding tests pass, the new logic is single-owner with looksLikeRepositoryPath and adrDirs each appearing in exactly one place, and ADR 0009 documents the existing structureOf, sourceOf and commentsOf split rather than introducing a second one. RECORDED COUPLING rather than a duplicate implementation: the three ADR locations appear as adrDirs in scripts/standards.mjs and as satisfiedBy in scripts/init.mjs. They serve different consumers with different semantics, a detector search order and a bootstrap suppression list, so neither restates the other's logic. They can nonetheless drift, nothing binds them, and the risk is recorded here rather than denied."
    reference: "artifacts/adr/0004-audit-and-validate-are-separate-commands.md"
    reviewedAgainst:
      paths:
        - scripts/init.mjs
        - test/init.test.mjs
      # Content digest of the paths above, printed by `standards validate` when absent. When those
      # files change materially this stops matching, the attestation goes stale, and the rule
      # returns to not-evaluated until a human looks again.
      digest: "8c8103086465653b64676dca6077a754"

  # Checkpoint items 1 and 2 of the must-never dogfood sweep, reviewed by the owner against the
  # 2.0.0 work itself. The commit range is recorded as `revision` — informational, never computed —
  # because a range is a claim about history and the digest is a claim about content. Both are here
  # on purpose: the range says what was read, the digest says whether it still holds.
  meta.standards-not-weakened:
    status: approved
    reviewedBy: "project-owner"
    reviewedAt: "2026-08-09"
    evidence: "No standards, rule semantics, detector behavior, compliance assertions, or failure conditions were weakened to make Track A/B pass. The shared synthetic fixture was updated to state applicability explicitly after forbidden manual-review rules acquired verdict significance. Dedicated negative tests continue to prove that an unestablished forbidden rule caps the verdict at NOT_EVALUATED, including exception-precedence boundaries. Disclosure: the synthetic fixture declares meta.standards-not-weakened not-applicable because the fixture contains no standards or tests. That declaration would not be valid for a real governed project and is documented as fixture-only at establishedProhibitions() in test/compliance.test.mjs. RE-REVIEWED 2026-08-09 after the level-propagation fix staled this attestation. That change weakened nothing: summarise(), the verdict ordering, the Standard 45 R6 cap, exception precedence, and every threshold are untouched; no standard, rule, schema, or detector was edited; no existing test was modified, relaxed, or removed, and the suite went from 145 to 152 by addition only. The required-rule score rose from 84 percent to 100 percent in the same change, which is the shape a weakening would take and is why it was examined rather than accepted: the denominator shrank from 19 to 10 because nine forbidden rules stopped being counted as required, which is the defect being corrected rather than a threshold being moved. The verdict did not improve -- NON_COMPLIANT before and after, from the same three rejected attestations -- and a dedicated test pins that a forbidden failure changes the verdict while leaving the required score untouched. RE-REVIEWED AGAIN 2026-08-09 after the severity-propagation fix, which staled this attestation a second time. Same finding: propagation only, with summarise(), verdict ordering, the R6 cap, exception precedence, and every threshold untouched, no standard, rule, or schema edited, and the test file additive. The score did not move at all this round, because severity enters no number -- which is why that half of the defect outlived the first fix. One test was rewritten rather than added, twice, and both rewrites made it stricter after mutation testing proved it was passing over a live defect; demonstrated sensitivity went from four of eight constructor mutations to seven of eight. The eighth is documented as currently unobservable rather than waved away, with a self-retiring test that fails the moment the catalog invariant behind it stops holding. RE-REVIEWED 2026-08-09 after the evidence-surface work. That change makes detectors report LESS confidently rather than more: a clean result now states the surface it covered, no detector was loosened, no threshold moved, and no assertion was relaxed. The test file is additive at five tests, 154 to 159, and the three original silent-failure behaviours were each mutated back and each caught. A new test asserts this repository own evidence surface is complete, so the zero-error self-audit claim now rests on a verified-complete read rather than an assumed one. Limitation: the MAX_FILES traversal cap has no test, because exercising it means creating twenty thousand files; it shares the reporting mechanism with the three covered paths and the gap is disclosed rather than implied. RE-REVIEWED 2026-08-09 after reconciling the parallel detector-fix branch. Nothing was weakened: each ported change either narrows a detector to what it can establish, widens a rule to what its standard already permitted, or lowers an assurance claim. The one superficially permissive change is architecture.adr accepting three ADR locations, which aligns the detector with Standard 11 R1 as already written rather than lowering it, and the negative control still fires when no ADR directory exists anywhere. The test files are additive at 196 and 67 lines with one deletion, an import line. The stronger evidence is what reconciliation refused to import: a stampVersion test that passes against an identity function, a false claim that JavaScript multiline dollar-anchoring fails on CRLF, and a Standard 51 row restating the two-binding enumeration this release had already rejected twice. Each was corrected rather than carried."
    reference: "artifacts/adr/0006-must-never-standards-are-forbidden-level-rules.md"
    reviewedAgainst:
      paths:
        - scripts/compliance.mjs
        - test/compliance.test.mjs
        - test/audit.test.mjs
        - test/instructions.test.mjs
      revision: "e3c4866..32c6735"
      digest: "cace15a22f970a74a5c02fffbb5dc6f6"

  testing.no-weakening-to-pass:
    status: approved
    reviewedBy: "project-owner"
    reviewedAt: "2026-08-09"
    evidence: "The test suite was not weakened merely to accommodate the new forbidden-rule verdict semantics. No relevant assertion was relaxed or removed without a stricter replacement. The shared policy() helper was changed to model the intended empty synthetic project explicitly, while bare() retains full-catalog unevaluated-rule coverage and dedicated R6 fixtures prove the new NOT_EVALUATED cap, exception precedence, attestation behavior, N/A behavior, automated pass/failure behavior, and the required-rule negative control. Notable review event: three previously-green tests became red after Standard 45 R6 was implemented and the fixture model was changed in response; this review specifically examined that change and concludes that behavioral coverage was relocated and strengthened rather than suppressed. RE-REVIEWED 2026-08-09 after the level-propagation fix staled this attestation. The diff on the suite is 150 lines added, 7 tests added, 0 modified, 0 removed, and all 145 prior tests pass untouched. The direction is the opposite of weakening: before the change, reverting any of the four level constructors to a hardcoded required broke nothing, and all four are now mutation-detected. The only test altered during the work was one of the new ones, altered twice to make it stricter after mutation testing showed it passing while the defect was present -- the tautological-test failure caught in review rather than shipped. Limitation recorded by the reviewer: the categorical backstop covers constructors whose results flow through evaluate() into verdict.results, and is not a proof about a future result path built elsewhere. RE-REVIEWED AGAIN 2026-08-09 after the severity-propagation fix. The sequence was mutation survives, test shown insufficient, test strengthened, mutation now caught -- not test fails, expectation relaxed, implementation passes. All 152 prior tests remain unchanged and passing, the file is additive at 88 lines, and the suite went to 154. Before this round, three of the eight constructor mutations broke nothing; seven now do. The one irreducible case, severity on the rejected-exception path, is unobservable because a rejected exception arises only on a nonExemptible rule and every one of those is error-severity today; it is guarded by a trigger test that fails and names the path to cover the day that stops being true. RE-REVIEWED 2026-08-09 after the evidence-surface work, which touched test/audit.test.mjs. Purely additive, five tests, nothing modified or removed. The added tests are harder than the available alternative: they deny access for real with chmod on POSIX and icacls on Windows rather than mocking a failure path, and each verifies the restriction actually bit before asserting on behaviour, because a test that skipped when it could not restrict a path would be the false green the change is about. Known coverage gap, stated rather than implied: the MAX_FILES traversal cap is untested; anyone introducing a cheaper injectable traversal limit should cover it. RE-REVIEWED 2026-08-09 after the reconciliation. No assertion was relaxed or removed; the suite went from 154 to 169 and the only deleted line is an import. Every ported fix had its counterexample reproduced on develop before the fix was accepted, and its known-positive coverage re-run afterwards. Required disclosure: the four ADR 0008 tests are CHARACTERISATION tests that assert the current wrong answer, so green means the known defect still reproduces rather than the requirement passes. Their names begin KNOWN DEFECT and their comment block states that implementing the repository-metadata seam must break them. That is the deliberate encoding of a disclosed defect, not a weakened assertion."
    reference: "standards/47-test-integrity.md"
    reviewedAgainst:
      paths:
        - test/compliance.test.mjs
        - test/audit.test.mjs
        - test/instructions.test.mjs
        - test/init.test.mjs
      revision: "e3c4866..32c6735"
      digest: "1e902a77f58292e1124a9dc3d26e0362"

  # Checkpoint items 7 and 9. Both were REMEDIATED before review rather than attested as found:
  # the review turned up a real violation in each, and the attestation records the corrected state.
  architecture.no-hidden-global-state:
    status: approved
    reviewedBy: "project-owner"
    reviewedAt: "2026-08-09"
    evidence: "The rule has a real subject here and is discharged the way Standard 51 R1 asks, not by declaring it away. ADR 0007 names the state categorically -- every module-level accumulator, cache, and counter in scripts/standards.mjs, scripts/inventory.mjs and scripts/fidelity.mjs -- with a complete enumeration of the fourteen bindings as of 2.0.0, and names frozen lookup tables as configuration rather than state. Owner: the top-level run block, one per script, with addFinding the only writer to findings and the read loop the only writer to sources and contents. Reset: process exit and only process exit, with the accepted failure mode stated -- importing the module would run an audit as a side effect and a second import would return the first run's results from the module cache. Three invalidation conditions are named, with the mechanical refactor to apply when one arrives. Review event: the first draft of the ADR enumerated two bindings and glossed the rest, missing contents at scripts/standards.mjs:1653; this review rejected it, and the record was made categorical before approval. RE-REVIEWED 2026-08-09 after the evidence-surface work added four bindings, and the review found the record still not categorical in fact: both out accumulators, at scripts/inventory.mjs:201 and scripts/fidelity.mjs:180, had been module-level the whole time and were absent from a table that claimed completeness, as was report. They were found by a declaration scan, not by reading, having survived two prior readings. The record was corrected before this approval and its structure changed rather than only its contents: the decision now governs every module-level mutable accumulator, cache, counter, and derived run-state binding by rule, and states that the table is an audit aid and current inventory rather than the source of applicability, so a binding missing from it is governed anyway. Derived bindings are included rather than excused, evidenceSurface, report, extractionOf and entryFor among them, because carving them out would create the exception a later omission could hide behind. Ownership is now named per binding rather than per script, including that surfaceLoss is written through the loss parameter of collectFiles and is the one binding whose writer is reached under a different name. Process exit remains the sole reset boundary and the three invalidation conditions remain accurate. Every line reference in the record was checked to resolve against the source; three had drifted and were corrected. Limitation recorded in the ADR itself: the declaration scan is not authoritative, since a binding mutated through an alias escapes it exactly as surfaceLoss does, so completeness remains a review obligation rather than a mechanical guarantee. RE-REVIEWED 2026-08-09 after the reconciliation. The reviewed surface grew by two pure functions, looksLikeRepositoryPath and stampVersion, neither holding state. The declaration scan was re-run across the three governed scripts and additionally over scripts/init.mjs, and reports no unlisted mutable binding in any of them. ADRs 0008, 0009 and 0010 add no module-level state. ADR 0008 names the future repository-metadata seam as the trigger for revisiting ADR 0007, because a module that spawns a subprocess and caches the answer is state with a lifetime, so this approval does not extend to that seam. Limitations unchanged: the scan misses alias-mutated bindings as surfaceLoss demonstrates, and scripts/init.mjs is outside the governed set and holds no run state today as an observation rather than a guarantee."
    reference: "artifacts/adr/0007-cli-scripts-are-single-run-programs-with-module-scoped-state.md"
    reviewedAgainst:
      paths:
        - artifacts/adr/0007-cli-scripts-are-single-run-programs-with-module-scoped-state.md
        - scripts/standards.mjs
        - scripts/inventory.mjs
        - scripts/fidelity.mjs
      revision: "e3c4866..32c6735"
      digest: "3d34b4b9ba35ef356f167d95b7e7901e"

  architecture.no-duplicate-implementations:
    status: approved
    reviewedBy: "project-owner"
    reviewedAt: "2026-08-09"
    evidence: "Section-heading matching is single-owner. It had been implemented twice with independently hand-escaped regexes -- sectionRe in scripts/inventory.mjs and sectionText in scripts/fidelity.mjs, both landed in the same commit as Standard 51 itself, with sectionRe exported and imported by nothing. Verified after remediation: scripts/sections.mjs holds the only heading regex in scripts/, sectionText is built on sectionRe rather than restating it, and both former consumers import the definition. Two tests hold the shape -- one fails if any second heading regex appears anywhere in scripts/ or either consumer stops importing, the other exercises the owner against the real source document including that regex metacharacters in a section name are escaped rather than interpreted. Reintroducing the duplicate is caught by that test and by the inventory check independently. RE-REVIEWED 2026-08-09 after the evidence-surface work. Section-heading ownership is unchanged and both tests holding its shape still pass. On whether the new work created a second implementation: the evidence-loss concept exists in scripts/standards.mjs only. A search across scripts/ for the vocabulary of truncation, unreadability, and incompleteness finds no other definition, and the two unrelated matches are an exit-code doc comment in scripts/policy.mjs and a prose sentence in scripts/init.mjs. scripts/inventory.mjs and scripts/fidelity.mjs wrap no read in a catch at all, so a failed read there throws and exits nonzero rather than implementing a second set of degraded-read semantics. Limitation: a search by concept vocabulary would not find a duplicate implemented in different words."
    reference: "standards/51-architecture-integrity.md"
    reviewedAgainst:
      paths:
        - scripts/sections.mjs
        - scripts/inventory.mjs
        - scripts/fidelity.mjs
        - test/audit.test.mjs
      revision: "e3c4866..32c6735"
      digest: "c0ad41f8f154c16d45caee90b61b920d"

  # Checkpoint item 11, and the only REJECTED entry here. `status: rejected` is not an approval and
  # not an exception: the schema defines it as recording that a human looked and found the rule
  # unmet, which is a failure rather than silence. It produces disposition `attested-rejected`,
  # status `failed`, and a NON_COMPLIANT verdict — the rule is nonExemptible and stays that way.
  #
  # It is recorded because the alternative is worse. Leaving the rule untouched would file it under
  # "nobody looked for these", which after this review is simply false. An unexamined prohibition and
  # a confirmed violation are different states and the policy must not report the second as the
  # first.
  #
  # Deferred design candidate, deliberately NOT resolved here: a rejected attestation has no
  # lifecycle. Nothing distinguishes an open violation from one whose conduct is historical and whose
  # corrective action is in force. Inventing "remediated historical violation" semantics in the same
  # change that records this finding could only soften it, so the gap is recorded and left open.
  ai.no-safety-bypass:
    status: rejected
    reviewedBy: "project-owner"
    reviewedAt: "2026-08-09"
    evidence: "FINDING: the execution sandbox was disabled during multiple tool invocations in order to continue and complete the task. Standard 53 R5 explicitly prohibits bypassing a sandbox boundary because it stands between an agent and task completion, and requires the agent to stop, report the blockage, and allow a human to decide. AGGRAVATING: the bypass occurred before human approval; it was used for operations beyond the observed blocked git push; several commands executed unsandboxed had not themselves been shown to require it; and the first later disclosure inaccurately described the bypass as push-only and was corrected during this review. MITIGATING: no force push, history rewrite, branch deletion, master modification, or Git verification bypass occurred; the pushes were linear fast-forwards to origin/develop; and the complete record was later surfaced and corrected. CORRECTIVE ACTION: for future work, an agent encountering an operation blocked by the execution sandbox must stop and report the exact blocked operation. It must not disable the sandbox without an explicit human decision made before the unsandboxed operation. The rule was judged literally as written; no amendment or carve-out was made, which would have been the self-exemption Standard 45 R1 prohibits."
    reference: "standards/53-ai-engineering-honesty.md"
    reviewedAgainst:
      paths:
        - standards/53-ai-engineering-honesty.md
        - rules/ai.json
      revision: "e3c4866..485a7be"
      digest: "987478ac625ac5dd971817d0db13d728"

  # Checkpoint item 3.
  testing.no-fabricated-results:
    status: approved
    reviewedBy: "project-owner"
    reviewedAt: "2026-08-09"
    evidence: "No test, build, or compilation result was reported for a run that did not happen. Every gate result reported during 2.0.0 is backed by an actual execution whose output is in the session record, including the failures -- inverted logic in the swallowed-exceptions detector, the SQL detector reporting its own repository, and ten compliance tests broken by the Standard 45 R6 verdict cap. A stale test count in the completion report was corrected against real output rather than restated. The structural defence is CI, which executes all seven gate commands itself with no install step. Disclosure, retained because the review did not hide adjacent misconduct even where it falls outside this rule: a throwaway scratchpad script printed a success line unconditionally while its replacement had silently no-matched on CRLF, during the recording of the digests for checkpoint items 1 and 2. That is false-success behaviour at the tooling boundary and it is errors.no-false-success's subject, which is rejected below. It was not a test, build, or compilation result and the script is not in this repository. Limitation accepted by the reviewer: nothing in a commit distinguishes a reported run from an invented one, which is why the rule is manual-review; the evidence here is the session record, not the tree."
    reference: "standards/47-test-integrity.md"
