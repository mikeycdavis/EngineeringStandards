# Project policy for the EngineeringStandards repository itself.
#
# This is the first dogfooded instance (Standard 34 R1) and therefore the pattern every adopting
# project will copy — including its mistakes. Three rules govern what may appear here:
#
#   * Rule IDs are canonical only (ADR 0002). No camelCase aliases; the schema rejects them.
#   * `applicability` and `exceptions` are different mechanisms and never substitute for each other.
#     not-applicable = the rule has no subject in this project.
#     exception      = the rule applies and this project knowingly does not satisfy it.
#   * Nothing here asserts compliance. What this project actually meets is a validation result.
#
# Shape: schemas/project-policy.schema.json (Standard 19). Meaning: standards/18-machine-readable-project-policy.md.

standardVersion: "2.0.0"
project: "EngineeringStandards"

rules:
  planning.breakdown-directory:
    level: required
  planning.one-file-per-section:
    level: required
  planning.acceptance-criteria:
    level: required
  planning.verification:
    level: required
  planning.handoff:
    level: required

  audit.business-state:
    level: required
  audit.actor-attribution:
    level: required

  ai.non-ui-capabilities:
    level: required
  ai.provider-neutral:
    level: required
  ai.propose-execute:
    level: required
  ai.destructive-approval:
    level: required

  architecture.project-manifest:
    level: required
  architecture.adr:
    level: required

  security.no-secrets-in-artifacts:
    level: required

  verification.before-completion:
    level: required

  # The must-never layer (Standards 45-53), adopted at 2.0.0 at its catalog level.
  #
  # `forbidden` differs from `required` in what satisfying it looks like: there is no positive
  # artifact to point at, only the absence of a violation. A `passed` here means "no violation was
  # found by the stated search" — never "this project does not do that" (Standard 45 R2). And a
  # forbidden rule nobody has examined blocks COMPLIANT rather than passing quietly
  # (Standard 45 R6), which is why every one of these is either evaluated, attested, or declared
  # not-applicable below.
  meta.standards-not-weakened:
    level: forbidden

  scm.no-committed-env-files:
    level: forbidden
  scm.no-generated-artifacts:
    level: recommended
  scm.no-shared-history-rewrite:
    level: forbidden

  testing.no-weakening-to-pass:
    level: forbidden
  testing.no-fabricated-results:
    level: forbidden
  testing.no-tautological-tests:
    level: recommended

  errors.no-swallowed-exceptions:
    level: forbidden
  errors.no-false-success:
    level: forbidden
  errors.no-unbounded-retry:
    level: forbidden
  observability.no-silenced-failures:
    level: forbidden

  data.migration-rollback:
    level: forbidden
  data.no-silent-discard:
    level: forbidden
  data.no-audit-corruption:
    level: forbidden
  data.no-prod-data-in-dev:
    level: forbidden

  security.no-disabled-access-controls:
    level: forbidden
  security.no-cert-bypass:
    level: forbidden
  security.no-sql-concat:
    level: forbidden
  security.no-untrusted-exec:
    level: forbidden

  architecture.no-hidden-global-state:
    level: forbidden
  architecture.no-boundary-bypass:
    level: forbidden
  architecture.no-duplicate-implementations:
    level: forbidden
  architecture.dependency-evaluation:
    level: required

  concurrency.no-unmanaged-shared-state:
    level: forbidden

  ai.no-fabricated-capabilities:
    level: forbidden
  ai.no-safety-bypass:
    level: forbidden

# Rules whose subject does not exist in this repository. Each is a claim about THIS PROJECT, not
# about the rule, and stops being true the moment the capability is added — hence `revisitWhen`.
applicability:
  audit.business-state:
    status: not-applicable
    reason: "No application state. This repository is documents, a CLI, and its tests; it performs no business mutations to audit."
    reviewedAt: "2026-08-08"
    revisitWhen: "Any command writes durable state outside the working tree."

  audit.actor-attribution:
    status: not-applicable
    reason: "No mutations exist to attribute. Authorship of repository changes is carried by git, which is not the audit system this rule governs."
    reviewedAt: "2026-08-08"
    revisitWhen: "Any command writes durable state outside the working tree."

  ai.non-ui-capabilities:
    status: not-applicable
    reason: "No user interface exists. Every capability is already a CLI invocation, so the rule's subject — a capability reachable only through a UI — cannot occur here."
    reviewedAt: "2026-08-08"
    revisitWhen: "Any interface other than the CLI is added."

  ai.provider-neutral:
    status: not-applicable
    reason: "No AI provider is integrated. The repository has zero dependencies and calls no model."
    reviewedAt: "2026-08-08"
    revisitWhen: "Any capability calls a model provider."

  # Must-never rules whose subject does not exist here (Standard 45 R6's third resolution path).
  #
  # Each is a claim about THIS PROJECT that was checked against the repository, not a convenient way
  # to clear the verdict — the rules with a real subject here are left unestablished until a human
  # attests to them, which is why this file still reports NOT_EVALUATED rather than COMPLIANT.
  #
  # Note what is NOT declared here: architecture.no-hidden-global-state has a real subject, because
  # scripts/standards.mjs holds module-level mutable state. Declaring it not-applicable because the
  # process is short-lived would be the self-exemption Standard 34 R3 prohibits.

  data.migration-rollback:
    status: not-applicable
    reason: "No database and no migrations. The repository has zero dependencies, no schema, and no data store; the mongodb and postgres strings in scripts/standards.mjs are the detector's own pattern table, which is a mention rather than a use."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any persistent store is added, or any script alters data it did not create."

  data.no-silent-discard:
    status: not-applicable
    reason: "No user data exists to discard. The tooling reads the repository's own files and writes reports; where a report truncates a long evidence list it says so in the message, and that is the closest thing here to the rule's subject."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any capability accepts and stores data on a user's behalf."

  data.no-audit-corruption:
    status: not-applicable
    reason: "No audit or historical store exists. Change history is git's, which this framework does not write."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any command writes an audit record."

  data.no-prod-data-in-dev:
    status: not-applicable
    reason: "No production environment and no production data exist. Every fixture under test/fixtures/ is authored for its test."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any environment holds real data, or any fixture is derived from a real dataset."

  security.no-disabled-access-controls:
    status: not-applicable
    reason: "No authentication or authorization exists to disable. The CLI reads a local directory and writes to stdout; there is no identity, no session, no permission model, and no client-supplied claim anywhere in scripts/."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any capability authenticates a caller or makes an authorization decision."

  security.no-untrusted-exec:
    status: not-applicable
    reason: "Nothing is executed as code. scripts/ contains no eval, no Function constructor, no node:vm, and no child_process; every input is parsed as data by scripts/yaml.mjs or JSON.parse."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any code path evaluates, spawns, or dynamically imports a value derived from input."

  errors.no-unbounded-retry:
    status: not-applicable
    reason: "No retry logic exists. Every script is a single pass over local files with no network calls and no loops that re-attempt a failed operation."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any capability retries, reconnects, or polls."

  concurrency.no-unmanaged-shared-state:
    status: not-applicable
    reason: "No concurrent execution. Each script is a single-threaded pass, and the test runner isolates test files in separate processes, so the module-level state in scripts/standards.mjs is reachable from exactly one execution context. That state is real and is architecture.no-hidden-global-state's subject, not this rule's."
    reviewedAt: "2026-08-09"
    revisitWhen: "Any script uses workers, threads, or in-process parallelism, or CI runs steps that share a mutable resource."

# ai.destructive-approval was declared not-applicable until 2026-08-09, with the trigger
# "`standards init` lands — it writes files, and Standard 33 R2's overwrite permission is exactly
# this rule." It landed, so the declaration was removed and the rule now applies at its catalog
# level. That is the whole purpose of `revisitWhen`: an applicability claim is a statement about the
# project at a moment, and this one stopped being true the moment the project gained the capability.
#
# No exceptions. Every rule that applies here is either met, failing, or honestly unevaluated, and a
# failing rule is reported as a failure rather than waived (Standard 20, Standard 30 R2).
exceptions: []

# Recorded human judgement for rules the catalog says a human evaluates (ADR 0005).
#
# An attestation is EVIDENCE, not a waiver. It never overrides an automated failure, and it goes
# stale the moment the reviewed paths change — which is why `reviewedAgainst` names them.
attestations:
  ai.destructive-approval:
    status: approved
    reviewedBy: "project-owner"
    reviewedAt: "2026-08-09"
    # One line: scripts/yaml.mjs supports a deliberately small subset and rejects block scalars
    # rather than guessing at them. The parser failing loudly here is the design working.
    evidence: "Reviewed the standards init write path. Creating a missing artifact is ordinary execute; replacing an existing one is refused by default and reported as a conflict. Overwriting requires naming the exact path, and approving one path does not approve another. Verified by the safety-contract tests in test/init.test.mjs. Re-reviewed 2026-08-09 after AGENTS.md and CLAUDE.md were added to ARTIFACTS: the additions widen what init creates and leave the create/overwrite/conflict logic untouched, so every path still routes through the same refusal."
    reference: "artifacts/adr/0004-audit-and-validate-are-separate-commands.md"
    reviewedAgainst:
      paths:
        - scripts/init.mjs
        - test/init.test.mjs
      # Content digest of the paths above, printed by `standards validate` when absent. When those
      # files change materially this stops matching, the attestation goes stale, and the rule
      # returns to not-evaluated until a human looks again.
      digest: "8c8103086465653b64676dca6077a754"
