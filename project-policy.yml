        status: approved
        reviewedBy: "project-owner"
        reviewedAt: "2026-08-09"
        evidence: "No shared history was rewritten and no meaningful history was deleted during 2.0.0. Evidence: the reflog for origin/develop records 28 updates, every one an ordinary push and not one a forced update; a pairwise ancestry check confirms all 28 were fast-forwards; the local develop reflog holds 20 entries, all commits plus one cherry-pick, with no reset, rebase, or amend; the range e3c4866..43fdad2 contains no merges and is linear; and e3c4866 is still an ancestor of develop. This is the rare case where the rule's recorded blind spot closes, because the reflog is the previous observation of the same history that a single snapshot lacks. Scope and limitations: the reflog is local and expiring, so it evidences what this clone observed rather than what the remote did outside it; master was not examined and nothing in this work touched it; the branch standard-31-implementation-and-detector-fixes was deliberately left unexamined and its history is outside this range. The reviewedAgainst digest below covers the rule text only and does not establish freshness of any of the above. RE-REVIEWED 2026-08-09 after the reconciliation, which staled this attestation by rewriting standards/46-source-control-safety.md for ADR 0008. That is a change to the rule text and not to the history evidence, so the two were assessed separately and the history claim was rechecked over the longer range: the reflog for origin/develop now records 31 updates, every one an ordinary push and not one a forced update; a pairwise ancestry check confirms all 31 were fast-forwards; the reconciliation range contains no merges; and e3c4866 remains an ancestor. The only non-commit entry in the local reflog is the creation of the reconciliation branch from develop, which adds no history and rewrites none. The digest below still covers rule text only and establishes freshness of none of this. Scope note: three worktrees now share this repository and the quarantined one sits on a branch this review does not cover."
