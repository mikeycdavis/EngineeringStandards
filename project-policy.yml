        evidence: "RE-REVIEWED 2026-08-29 against committed repository content at 77730e4, the merged head of develop, by Michael Davis as project owner, who directed this review and named the propositions it was to settle. FRESH REVIEW OF THE CHANGED SURFACE, INHERITING NOTHING FROM EVENT 005: superseded rather than extended, and its digest is not carried across. EXACTLY ONE REVIEWED PATH CHANGED, MEASURED BY BLOB IDENTITY. test/compliance.test.mjs (095462d3), test/audit.test.mjs (c50b3ec7) and test/instructions.test.mjs (08ef3bff) are byte-identical at dde2e85 and 77730e4. scripts/compliance.mjs moves from 3015fdaf to 6110fd47 by sixteen inserted lines, one of them executable. NO TEST WAS WEAKENED, REMOVED OR RELAXED, WHICH IS THE FIRST WAY THIS RULE BREAKS AND THE EASIEST TO CHECK: all three reviewed test files are unchanged in content, and the suite at this revision reports 425 tests, 421 passing, 0 failures and 4 skipped, having grown by twelve tests rather than shrunk. NO APPLICABILITY DETERMINATION CHANGED: project-policy.yml is untouched by both pull requests, so no rule moved level, no exception was added, and no not-applicable declaration was written; the four standing recorded rejections are unaffected. NO RECLASSIFICATION, MEASURED IN THE FILE WHERE ONE WOULD LIVE: rules/documentation.json is not a reviewed path of this attestation but is named here because a reclassification there would be this rule's subject. It changed by exactly one field, the prose $assuranceNote, and documentation.code-consistency keeps level required, severity error, validationType structural, assurance partial and nonExemptible false. THE VERIFICATION MECHANISM WAS NOT BYPASSED. The change makes an instruction ask for less, and the tell this rule names is a rule yielding to the code it judges. Here the instruction was measured to be false for one class of finding -- the run had not established that the document was wrong -- and the finding it accompanies still raises, still carries severity error, and still fails the rule. Nothing became passable that was failing. The route that would have made the adopter green, resolving a token by proximity to a nearby link, was available, was rejected, and is recorded as rejected. NO EXEMPTION WAS SOUGHT OR TAKEN: this rule is nonExemptible, and an attestation is evidence rather than a waiver, so this event establishes the rule only in conjunction with freshness and never overrides an automated finding. SCOPE NOT REVIEWED, AND IT MATTERS MORE FOR THIS RULE THAN FOR ANY OTHER: scripts/standards.mjs is not a reviewed path of this attestation, and it is where detector coverage actually narrowed. A token beginning with ./ is now withdrawn rather than reported, which is a real reduction in what the check can say. It was taken on measured evidence that the base was unavailable, and its coverage cost is asserted in a test rather than left to be discovered later, but this event does not establish that judgement. What it establishes is that within the reviewed path set no standard, test, applicability determination, evidence requirement or verification mechanism was weakened, removed, bypassed or reclassified. MATERIAL LIMITATION RESTATED: this approval does not assert that human review is a sufficient control against standards weakening; it asserts what was examined at this revision."
