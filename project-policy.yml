      - id: "review-scm-no-shared-history-rewrite-003"
        supersedes: "review-scm-no-shared-history-rewrite-002"
        status: rejected
        reviewedBy: "project-owner"
        reviewedAt: "2026-08-11"
        evidence: "FINDING: the branch fix/env-detector-consults-repository-seam was rewritten non-fast-forward after it had already been shared. Measured rather than recalled. The remote-tracking reflog for origin/fix/env-detector-consults-repository-seam records two updates by push, 86a7454 then a72f302, with no fast-forward relationship between them; the local reflog records the branch created from origin/develop at 3613902, a commit at 86a7454, then rebase finish onto 6bb3467 producing 2de7d19, so 3613902 and 86a7454 are the commits the forced update removed from the ref. The branch was shared before the rewrite in fact and not merely by publication: PR #12 opened from it at 21:09:04Z, a reviewer submitted a review at 21:12:25Z, and both inline comments carry original_commit_id 86a7454. One of the two lost its live anchor as a result, comment 3753417966 now reporting line null. Standard 46 R4 prohibits rewriting shared history without explicit justification, and its carve-out is temporal in its own words, rewriting your own unshared branch BEFORE it is shared, so a rewrite after publication, after the pull request, and after review is inside the rule's subject. No exception applies: the exception table's condition is the purge of a secret or unlawful content where rotation is insufficient, and this was a rebase to update a branch onto merged develop. No explicit justification existed before the act. The owner's instruction was to update the branch onto merged develop and named no method; the rebase was the agent's choice, and it was avoidable, because gh pr merge --rebase performs the same linearization server-side at merge time and would have satisfied the linear-history requirement on develop without rewriting the published ref. Disclosure came after the act, which is what the word explicit exists to exclude. MITIGATING, and recorded as reducing harm rather than as satisfying the rule: no protected branch was rewritten, develop and master were untouched, the PR branch itself carries no protection, the repository has one collaborator and zero forks, and the rule's stated cost of a deleted commit taking its evidence with it did not fully materialise. ATTRIBUTION CORRECTION, made during this review: the agent first described the commits as deleted. That overstated it. All four commits at issue, 86a7454, 3613902, 8129d81 and 05ac7dc, still resolve server-side where GitHub retains pull-request-referenced objects, so the commits were DETACHED FROM THE BRANCH REF RATHER THAN DESTROYED. The shared ref was still rewritten without prior explicit justification, which is the prohibited act, and the surviving retrievability does not move it back inside the carve-out. CORRECTIVE ACTION, stated narrowly so the lesson is operational without amending Standard 46 to excuse this incident: once a branch has been pushed or otherwise shared, do not rebase or force-push it merely to update it onto develop. Prefer updating without rewriting the published ref, or let the protected merge mechanism perform the final linearization. Where rewriting is genuinely required, stop and obtain explicit justification before the act. SCOPE: PR #13's rebase-merge is NOT part of this finding. It extended develop rather than rewriting it, so R4 was not triggered there; the dangling revision pointers it left in two attestation events are a provenance-pointer consequence and not a shared-history rewrite. LIMITATION carried forward from the prior events and unchanged: reviewedAgainst digests file content, not history, so the digest below establishes freshness for the rule text only while the history evidence above rests on reflog and API inspection recorded here. This rejection is a historical record and is to remain recorded after the corrective action is in force, rather than being rewritten into an approval."
