      - id: "review-architecture-no-hidden-global-state-004"
        supersedes: "review-architecture-no-hidden-global-state-003"
        status: approved
        reviewedBy: "project-owner"
        reviewedAt: "2026-08-11"
        evidence: "RE-REVIEWED 2026-08-11 against committed repository content at a72f302. scripts/standards.mjs changed with the env-detector rewrite; scripts/inventory.mjs, scripts/fidelity.mjs and ADR 0007 are byte-identical. The original basis holds and was re-examined rather than assumed: the scripts remain single-run programs whose module scope is their run scope, single-writer ownership is unchanged, reset is still process exit, and nothing imports them. The declaration scan was re-run across the governed set and reports one new module-level binding since 460992a, ENV_PATHSPECS, a frozen array of pathspec strings. It is immutable configuration describing what to ask the index for, not run state, and it satisfies the invariant recorded in the prior cycle: module scope may hold immutable matcher descriptions, while mutable matcher instances stay invocation-local. No new /g regex was introduced at module level and no binding acquired a lifetime. The new call into scripts/repository.mjs adds no module-level state on either side, which was the deliberate constraint accepted when the Git seam was opened. LIMITATION unchanged and carried forward: the declaration scan is not authoritative, because a binding mutated through an alias escapes it as surfaceLoss does through the loss parameter of collectFiles, so completeness remains a review obligation rather than a mechanical guarantee. The dormant follow-on stands with its trigger intact: ITEM_RE in scripts/inventory.mjs is a module-level /gm regex predating this rule, revisited when inventory.mjs is next substantively modified or if a use is introduced that consumes it directly and can persist lastIndex. MATERIAL LIMITATION restated: this record was found incomplete at four consecutive reviews before the scope statement became behavioural, and this approval still does not assert that human enumeration is a sufficient control against hidden global state."
