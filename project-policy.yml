  # Checkpoint item 4, the second REJECTED entry. The finding is read from the code rather than
  # reproduced at runtime, and the owner review concluded that reproduction is unnecessary: the
  # control flow itself shows a failed read becoming an indistinguishable clean result.
  errors.no-false-success:
    reviews:
      - id: "review-errors-no-false-success-001"
        status: rejected
        reviewedBy: "project-owner"
        reviewedAt: "2026-08-09"
        evidence: "FINDING: the evaluator can report successful negative evidence after an underlying evidence-gathering failure. readText at scripts/standards.mjs:536 converts an unreadable file into the empty string, and collectFiles at :518 converts an unreadable directory into an empty traversal result. Downstream detectors then have no way to distinguish nothing was found from nothing could be searched: they contribute no finding, the audit exits 0, and no output states that a file could not be read. Separately, readText truncates silently at MAX_READ_BYTES of 400000 bytes at :379 and :539, so a file larger than that is scanned in part and reported on as though scanned whole; MAX_READ_BYTES appears nowhere else in the codebase and there is no disclosure path. This is the invariant this release itself wrote down -- Standard 44 R12, a negative discovery result is evidence about the search mechanism before it is evidence about the project -- failing in the tool that supplies the evidence. CORRECTIVE ACTION: unreadable files and directories, and truncated files, must become visible findings or must otherwise prevent the audit from claiming an undisclosed clean search. SCOPE: read from the control flow, not reproduced at runtime; no unreadable file or oversized file was constructed to demonstrate the effect, and no file in this repository currently exceeds the limit. The reviewer judged the control flow sufficient. This rejection is a historical record and is to remain recorded after the defect is fixed, rather than being rewritten into an approval."
