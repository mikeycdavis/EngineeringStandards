        reviewedAgainst:
          paths:
            - scripts/standards.mjs
            - standards/48-error-handling-and-observability.md
          revision: "e3c4866..43fdad2"
          digestAlgorithm: "working-tree-bytes-sha256-v1"
          digest: "f784c84393fbae9ddd0d13ae4dcd23f3"

