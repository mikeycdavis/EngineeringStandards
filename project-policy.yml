 this round, three of the eight constructor mutations broke nothing; seven now do. The one irreducible case, severity on the rejected-exception path, is unobservable because a rejected exception arises only on a nonExemptible rule and every one of those is error-severity today; it is guarded by a trigger test that fails and names the path to cover the day that stops being true. RE-REVIEWED 2026-08-09 after the evidence-surface work, which touched test/audit.test.mjs. Purely additive, five tests, nothing modified or removed. The added tests are harder than the available alternative: they deny access for real with chmod on POSIX and icacls on Windows rather than mocking a failure path, and each verifies the restriction actually bit before asserting on behaviour, because a test that skipped when it could not restrict a path would be the false green the change is about. Known coverage gap, stated rather than implied: the MAX_FILES traversal cap is untested; anyone introducing a cheaper injectable traversal limit should cover it. RE-REVIEWED 2026-08-09 after the reconciliation. No assertion was relaxed or removed; the suite went from 154 to 169 and the only deleted line is an import. Every ported fix had its counterexample reproduced on develop before the fix was accepted, and its known-positive coverage re-run afterwards. Required disclosure: the four ADR 0008 tests are CHARACTERISATION tests that assert the current wrong answer, so green means the known defect still reproduces rather than the requirement passes. Their names begin KNOWN DEFECT and their comment block states that implementing the repository-metadata seam must break them. That is the deliberate encoding of a disclosed defect, not a weakened assertion."
