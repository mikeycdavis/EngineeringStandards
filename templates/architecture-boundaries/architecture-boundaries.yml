# architecture-boundaries.yml -- an optional, explicit declaration of architectural boundaries
# (Standard 51 R2, ADR 0018). Place it at the repository root, beside project-policy.yml; it is
# discovered by that name. Its absence changes nothing. Its presence is validated by
# `standards policy` and `standards validate` (shape and internal consistency) and checked against
# the tree by `node <standards-repo>/scripts/boundaries-check.mjs --dir=.`.
#
# Schema: schemas/architecture-boundaries.schema.json. Replace every placeholder below: a member
# must own real paths, and every file under `observation.roots` must be owned by exactly one member.
# Do not copy this repository's own declaration; it describes this repository's scripts/.
observation:
  method: "static-import-graph"
  roots:
    - src
  extensions:
    - ".js"
  cannotObserve:
    - mechanism: "dynamic-import-computed"
      reason: "Only string-literal import() is resolved."
    - mechanism: "reflection"
      reason: "Reflection, eval and generated code are not examined."
    - mechanism: "subprocess"
      reason: "Imports of the child-process module are seen; what a subprocess runs is not."
    - mechanism: "network"
      reason: "Network paths are not examined."

members:
  - id: "core"
    kind: "layer"
    description: "Replace: what this layer is and owns."
    paths:
      - src/core/
    evidence:
      - PROJECT.md:1
  - id: "app"
    kind: "layer"
    description: "Replace: what this layer is and owns."
    paths:
      - src/app/
    evidence:
      - PROJECT.md:1

edges:
  - from: "app"
    to: "core"
    via:
      - "*"
    evidence:
      - PROJECT.md:1

external:
  allowPrefixes:
    - "node:"
  evidence:
    - PROJECT.md:1
